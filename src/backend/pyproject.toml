[project]
name = "mercy-backend"
version = "0.1.0"
authors = [
    { name = "David-Peralta-Rd", email = "crdavidperalta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel] # scaffold
packages = ["config", "apps"]

[tool.uv] # scaffold
prerelease = "disallow"

[tool.pytest.ini_options] # scaffold
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests/test_*.py"]

[tool.mypy] # scaffold
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[project.scripts] # scaffold
serve = "config.cli:serve"
manage = "config.cli:manage"
