[project]
name = "mercy-frontend"
version = "0.1.0"
authors = [
    { name = "David-Peralta-Rd", email = "crdavidperalta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel] # scaffold
packages = ["mercy_front"]

[tool.uv] # scaffold
prerelease = "disallow"

[tool.mypy] # scaffold
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts] # scaffold
serve = "mercy_front.cli:serve"
